name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: aws-actions/setup-sam@v2

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Compile Python
        run: python -m compileall -q backend scripts tests

      - name: Test backend logic
        run: npm run test:backend

      - name: Test Python modules
        run: npm run test:python

      - name: Validate SAM template
        run: npm run validate:sam

      - name: Build all Lambda functions
        run: npm run build:sam

      - name: Test frontend Golden Path
        run: npm run smoke

      # 問麥麥（chat.html）走的是真 /chat，但 smoke 這條從來沒有涵蓋 chat 頁——
      # 「CI 綠」因此不代表對話流程跑過（#62／#71／#72 三個 chat 的洞都是這樣溜上線的）。
      # 逾時／取消那道防線就在這支裡（第 30 項），不排進 CI 的話它永遠不會被執行到。
      - name: Test 問麥麥 chat flow
        run: npm run smoke:chat

      - name: Upload smoke screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-mobile
          path: |
            smoke_mobile.png
            smoke_chat.png
          if-no-files-found: ignore
