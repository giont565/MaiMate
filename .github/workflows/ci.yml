name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: aws-actions/setup-sam@v2

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Compile Python
        run: python -m compileall -q backend scripts tests

      - name: Test backend logic
        run: npm run test:backend

      - name: Test Python modules
        run: npm run test:python

      - name: Validate SAM template
        run: npm run validate:sam

      - name: Build all Lambda functions
        run: npm run build:sam

      - name: Test frontend Golden Path
        run: npm run smoke

      - name: Upload smoke screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-mobile
          path: smoke_mobile.png
          if-no-files-found: ignore
