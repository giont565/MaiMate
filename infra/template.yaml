# AWS SAM — MAX Copilot 完整部署
# 部署：sam build && sam deploy --guided
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MAX Copilot serverless stack

Parameters:
  KnowledgeBaseId:
    Type: String
    Default: DSIYBVI1IX
    Description: Bedrock Knowledge Base used by the query_knowledge agent tool

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref SessionTable

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: ["Content-Type"]

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.chat.handler
      CodeUri: ../
      Timeout: 60
      Environment:
        Variables:
          KB_ID: !Ref KnowledgeBaseId
          BEDROCK_REGION: !Ref AWS::Region
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Converse]
              Resource: "*"
            - Effect: Allow
              Action: [aws-marketplace:ViewSubscriptions, aws-marketplace:Subscribe]
              Resource: "*"
            - Effect: Allow
              Action: [bedrock:Retrieve]
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"
        - DynamoDBCrudPolicy: { TableName: !Ref SessionTable }
      Events:
        Post: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /chat, Method: POST } }

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.health.handler
      CodeUri: ../
      Events:
        Get: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /health, Method: GET } }

  MarketFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.market.handler
      CodeUri: ../
      Events:
        Get: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /market, Method: GET } }

  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.order.handler
      CodeUri: ../
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionTable }
      # MAX_API_KEY / MAX_API_SECRET 不寫在模板——部署後由 Secrets Manager
      # 或 console 環境變數注入，嚴禁進版控
      Events:
        Post: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /order, Method: POST } }

  AuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.handlers.audit.handler
      CodeUri: ../
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SessionTable }
      Events:
        Get: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /audit, Method: GET } }

  SessionTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey: { Name: pk, Type: String }

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration: { IndexDocument: index.html }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        Description: CloudFront access to the private MaiMate frontend bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${AWS::StackName} mobile frontend"
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies: { Forward: none }
        PriceClass: PriceClass_100

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  FrontendUrl:
    Description: HTTPS URL for mobile and desktop demos
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendBucket:
    Description: S3 bucket to receive frontend assets
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: CloudFront distribution to invalidate after frontend updates
    Value: !Ref FrontendDistribution
