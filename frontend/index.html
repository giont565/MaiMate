<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaiMate 麥麥</title>
<style>
  /* 視覺系統來源：docs/mockups/base.css（設計稿三畫面），改為響應式 */
  :root{--navy:#16224D;--navy-d:#0D1530;--ice:#EAF0FB;--gold:#E8A13A;--green:#1F9D66;--red:#D64550;--ink:#1F2937;--mut:#6B7280;--bg:#F4F7FD}
  *{box-sizing:border-box;font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;margin:0}
  body{background:var(--bg);color:var(--ink)}

  /* ── 頂欄 ── */
  .topbar{background:var(--navy-d);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20}
  .topbar .logo img{width:34px;height:37px;image-rendering:pixelated;display:block}
  .topbar h1{font-size:17px;font-weight:700}
  .topbar .sub{font-size:10px;color:#A9B7D9}
  .badge{margin-left:auto;background:#22315E;border:1px solid var(--gold);color:var(--gold);font-size:10.5px;padding:3px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
  /* 模式徽章可點（app.js cycleMode），但視覺是小膠囊：用透明 ::after 只放大可點範圍，
     視覺不動。寬度已 64px≥44，只補高度；頂欄同高沒有其他控件，不會壓到別的熱區。 */
  .badge{position:relative}
  .badge::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:46px}
  .offline{font-size:10px;color:#FF9AA2;display:none;margin-left:8px}

  /* ── 版面：手機單欄，桌機（≥900px）雙欄 ── */
  main{max-width:480px;margin:0 auto;padding:14px 14px 96px}
  @media (min-width:900px){
    main{max-width:1080px;display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;padding-bottom:20px}
    #side{position:sticky;top:76px}
  }

  .hello{font-size:15px;font-weight:700;margin:4px 2px 12px}
  .hello span{color:var(--mut);font-weight:400;font-size:12px;display:block;margin-top:3px}
  .sec{font-size:12px;font-weight:700;color:var(--navy);margin:10px 2px 8px}
  .navigation-source{background:#fff;border:1px solid #C9D6EE;border-left:4px solid #1E4DA7;border-radius:12px;padding:12px 14px;margin:4px 0 12px}
  .navigation-source b{display:block;color:var(--navy);font-size:13px;line-height:1.5}
  .navigation-source p{color:var(--mut);font-size:11.5px;line-height:1.6;margin-top:3px}

  /* 麥麥健康分 hero 卡（設計稿 screen1；分數＝真實子項透明加權，公式上卡） */
  .hero{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 6px rgba(22,34,77,.07);display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .hero .ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
  .hero .ring i{width:54px;height:54px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;line-height:1}
  .hero .ring i b{font-weight:800;font-size:21px;color:var(--navy)}
  .hero .ring i s{text-decoration:none;font-size:8.5px;color:var(--mut);margin-top:2px}
  .hero .htxt{min-width:0}
  .hero .htxt .n{font-size:14px;font-weight:800;color:var(--navy)}
  .hero .htxt .l{font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.45}
  .hero .htxt .pnl{font-size:11px;font-weight:700;margin-top:5px}
  .hero .htxt .pnl b{color:var(--navy)}
  .hero .htxt .pnl .pos{color:var(--green)} .hero .htxt .pnl .neg{color:var(--red)}
  .hero .htxt .formula{font-size:9px;color:var(--mut);margin-top:5px;line-height:1.4}

  /* 健檢 2×2 卡 */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
  .card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 6px rgba(22,34,77,.07)}
  .card .n{font-size:22px;font-weight:800}
  .card .l{font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.4}
  .insight{background:#fff;border-left:4px solid var(--red);border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.6;margin-bottom:10px;box-shadow:0 1px 6px rgba(22,34,77,.06)}
  .insight b{color:var(--red)}
  .insight.g{border-color:var(--green)} .insight.g b{color:var(--green)}

  /* 行情膠囊列 */
  .tick{display:flex;justify-content:space-between;background:#fff;border-radius:12px;padding:9px 13px;margin-bottom:8px;font-size:12.5px;box-shadow:0 1px 5px rgba(22,34,77,.05)}
  .tick b{color:var(--navy)}
  .tick .v{font-variant-numeric:tabular-nums;transition:color .3s;font-weight:700}
  .tick .v.up{color:var(--green)}
  .tick .v.down{color:var(--red)}

  /* ── 對話 ── */
  #chatlog{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .msg{max-width:86%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.65;margin-bottom:10px}
  .msg.user{align-self:flex-end;background:var(--ice);border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:var(--navy);color:#fff;border-bottom-left-radius:4px}
  .msg.ai b{color:var(--gold)}
  .tools{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
  .tool{font-size:10px;background:#fff;border:1px solid #C9D6EE;color:var(--navy);border-radius:999px;padding:3px 9px;font-weight:600}
  .tool .ok{color:var(--green)}

  /* 三方案卡（README §3 scenarios） */
  .scen{background:#fff;border:1.5px solid #E3E9F5;border-radius:14px;padding:12px 14px;margin-bottom:9px;box-shadow:0 1px 5px rgba(22,34,77,.05);cursor:pointer}
  .scen:active{transform:scale(.99)}
  .scen .hint{font-size:10px;color:var(--mut);margin-top:7px;text-align:right}
  .scen.pick{border-color:var(--gold);background:#FFFDF6}
  .scen .t{display:flex;align-items:center;font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:6px}
  .scen .tag{margin-left:auto;font-size:9.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--ice);color:var(--navy)}
  .scen.pick .tag{background:var(--gold);color:#fff}
  .scen .row{display:flex;gap:10px;font-size:10.5px;color:var(--mut)}
  .scen .row b{display:block;font-size:12.5px;color:var(--ink);margin-top:1px}
  .scen .row>div{flex:1}
  .scen .note{font-size:10.5px;color:var(--mut);margin-top:7px;line-height:1.5}

  /* 下單確認卡（設計稿 screen3） */
  .confirm{background:#FFF8EA;border:2px solid var(--gold);border-radius:16px;padding:16px;margin-bottom:12px}
  .confirm .h{font-size:14.5px;font-weight:800;color:var(--navy);margin-bottom:10px}
  .confirm table{width:100%;font-size:12.5px;border-collapse:collapse}
  .confirm td{padding:5px 0;color:var(--mut)}
  .confirm td:last-child{text-align:right;color:var(--ink);font-weight:700}
  .confirm .warn{font-size:10.5px;color:var(--red);margin-top:8px;line-height:1.5}
  .btns{display:flex;gap:10px;margin-top:12px}
  .btns button{border:0;border-radius:12px;padding:12px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
  .btns button:disabled{opacity:.55;cursor:not-allowed}
  .btns .ok{flex:1.4;background:var(--green);color:#fff}
  .btns .no{flex:1;background:#E8EDF7;color:var(--ink)}
  .done{background:#EBF9F1;border:1.5px solid var(--green);color:#116b45;border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:700;margin-bottom:12px}

  /* 決策軌跡面板（設計稿 screen3） */
  .trail{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(22,34,77,.06);margin-bottom:12px}
  .trail .h{font-size:12.5px;font-weight:800;color:var(--navy);display:flex;margin-bottom:10px}
  .trail .h span{margin-left:auto;font-size:10px;color:var(--green);font-weight:700}
  .step{display:flex;gap:10px;font-size:11px;color:var(--ink);margin-bottom:7px;align-items:baseline}
  .step i{font-style:normal;color:var(--mut);font-size:10px;flex:none;width:40px}
  .step em{font-style:normal;font-family:ui-monospace,Consolas,monospace;background:var(--ice);color:var(--navy);border-radius:6px;padding:1px 7px;font-size:10px}
  .step.hl em{background:#FFEBC2;color:#8a5a00}

  /* 底部輸入列：手機固定、桌機貼齊對話欄 */
  .inputbar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 14px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid #E3E9F5;z-index:20}
  .inputbar input{flex:1;background:var(--bg);border:1px solid #D5DEF0;border-radius:999px;padding:10px 16px;font-size:13px;font-family:inherit}
  /* 44px 是 Apple HIG 的最小觸控目標；原本 42px 差兩格，手機上按送出容易點空 */
  .inputbar button{width:44px;height:44px;border-radius:999px;background:var(--navy);color:#fff;border:0;font-size:16px;cursor:pointer;flex:none}
  @media (min-width:900px){
    .inputbar{position:sticky;bottom:0;border:1px solid #E3E9F5;border-radius:16px;margin-top:8px}
  }

  /* 鍵盤焦點可見（a11y）：滑鼠點擊不顯示、鍵盤 tab 才顯示 */
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .badge:focus-visible{outline-offset:3px}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><img src="maimate_bot_small.png" alt="麥麥"></div>
  <div><h1>MaiMate 麥麥</h1><div class="sub">市場一直在變，麥麥一直陪你</div></div>
  <span class="offline" id="offline">離線展示</span>
  <span class="badge" id="mode-badge" role="button" tabindex="0" aria-label="切換 AI 回應模式（Demo）" style="cursor:pointer" title="點擊切換使用者模式（Demo）">成長陪跑</span>
</header>
<main>
  <aside id="side">
    <div class="hello">早安！這是你今天的投資健檢<span id="hello-basis">依據 2025 年交易紀錄整理（示範資料）</span></div>
    <div id="hero" class="hero"></div>
    <div class="cards" id="health"></div>
    <div class="sec">麥麥幫你看到的事</div>
    <div id="insights"></div>
    <div class="sec">即時行情</div>
    <div id="market"></div>
  </aside>
  <section id="chatcol">
    <aside class="navigation-source" id="navigation-source" aria-live="polite" hidden>
      <b id="navigation-source-title"></b>
      <p id="navigation-source-meta"></p>
    </aside>
    <div id="chatlog"></div>
    <form class="inputbar" id="chatform">
      <input id="q" placeholder="問麥麥任何事，例如：我去年虧最多的是哪一筆？" autocomplete="off">
      <button type="submit" aria-label="送出">➤</button>
    </form>
  </section>
</main>
<script>window.API_BASE = "https://hwgog76s3a.execute-api.us-east-1.amazonaws.com";</script>
<script src="navigation-context.js"></script>
<script src="chat-context.js"></script>
<script src="app.js"></script>
</body>
</html>
