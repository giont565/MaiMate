<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaiMate 麥麥</title>
<style>
  /* 視覺系統：與 Screen 6（home.html）同一套語言——同色票、同圓角、同平塗。
     兩頁擺在一起要看得出是同一個產品，而不是兩個團隊各做各的。

     這次只動 <style>：class 名稱、DOM 結構、app.js、畫面上每一個字與數字都沒有改。
     分鏡稿的口白與【預期】引用的是文字與數字，所以劇本不受影響。 */
  :root{
    /* Screen 6 的色票 */
    --bg:#FBFCFE;--card:#FFFFFF;--txt:#0F172A;--sub:#46557B;--mut:#6B7280;
    --line:#E3E9F5;--tint:#EEF3FC;--blue:#1E4DA7;--warm:#FFF6EC;
    /* 金融語意色沿用設計稿，不跟著換——漲跌與警示的顏色是約定，不是風格 */
    --navy:#16224D;--gold:#E8A13A;--green:#1F9D66;--red:#D64550;
    /* 舊變數保留別名，避免漏改一處就變成透明字 */
    --ink:var(--txt);--ice:var(--tint);--navy-d:#0D1530
  }
  *{box-sizing:border-box;font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;margin:0}
  html,body{max-width:100%;overflow-x:clip}
  html{background:var(--bg)}
  body{background:var(--bg);color:var(--txt)}

  /* ── 頂欄：改成 Screen 6 的淺色半透明貼頂 ── */
  .topbar{
    background:rgba(251,252,254,.96);color:var(--txt);
    padding:calc(8px + env(safe-area-inset-top)) 18px 8px;
    display:flex;align-items:center;gap:9px;min-height:58px;
    position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(227,233,245,.86)
  }
  .topbar .logo img{width:35px;height:38px;image-rendering:pixelated;display:block}
  .topbar h1{font-size:15px;font-weight:700;line-height:1.25;letter-spacing:.01em}
  .topbar .sub{font-size:10.5px;color:var(--mut);line-height:1.35;margin-top:2px}
  .badge{
    margin-left:auto;background:var(--tint);border:1px solid var(--line);color:var(--blue);
    font-size:11px;padding:0 10px;height:26px;display:inline-flex;align-items:center;
    border-radius:999px;font-weight:800;white-space:nowrap
  }
  /* 模式徽章可點（app.js cycleMode），但視覺是小膠囊：用透明 ::after 只放大可點範圍，
     視覺不動。撐高不撐寬，頂欄同高沒有其他控件，不會壓到別的熱區。 */
  .badge{position:relative}
  .badge::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:44px}
  .offline{font-size:10px;color:var(--red);font-weight:700;display:none;margin-left:8px}
  /* 示範帳戶「常設」標示：掛在 sticky 頂欄裡，捲不走。
     聊天流裡那條金框橫幅只是一則 log——確認卡出現時它早就捲出視窗了，
     那一刻畫面上唯一的標示會變成模型自己那句話，等於沒有任何程式保證。
     chat.html 的對等物是 #chat-subtitle（同樣在 sticky header 裡）。 */
  .demo-pill{font-size:10px;color:#7A4E00;background:var(--warm);border:1px solid var(--gold);
    font-weight:800;display:none;margin-left:8px;padding:3px 8px;border-radius:999px;white-space:nowrap}

  /* ── 版面：手機單欄，桌機（≥900px）雙欄 ── */
  main{max-width:480px;margin:0 auto;padding:14px 18px 100px}
  @media (min-width:900px){
    main{max-width:1100px;display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start;padding-bottom:24px}
    #side{position:sticky;top:76px}
  }

  .hello{font-size:22px;font-weight:800;line-height:1.32;letter-spacing:-.015em;margin:6px 0 14px;text-wrap:balance}
  .hello span{color:var(--sub);font-weight:400;font-size:12.5px;line-height:1.65;display:block;margin-top:6px;letter-spacing:0}
  .sec{font-size:12px;font-weight:800;color:var(--sub);margin:18px 0 9px;letter-spacing:.02em}
  .navigation-source{background:var(--tint);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;padding:11px 13px;margin:4px 0 13px}
  .navigation-source b{display:block;color:var(--txt);font-size:12.5px;line-height:1.5}
  .navigation-source p{color:var(--mut);font-size:11.5px;line-height:1.6;margin-top:3px}

  /* 卡片語言：Screen 6 是 1px 邊框＋16px 圓角＋平塗，不用陰影堆層次 */
  .hero,.card,.insight,.tick,.scen,.trail,.done,.confirm{box-shadow:none}

  /* 麥麥健康分 hero 卡（分數＝真實子項透明加權，公式上卡） */
  .hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 15px;display:flex;align-items:center;gap:13px;margin-bottom:10px}
  .hero .ring{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
  .hero .ring i{width:53px;height:53px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;line-height:1}
  .hero .ring i b{font-weight:800;font-size:21px;color:var(--navy)}
  .hero .ring i s{text-decoration:none;font-size:8.5px;color:var(--mut);margin-top:2px}
  .hero .htxt{min-width:0}
  .hero .htxt .n{font-size:14.5px;font-weight:800;color:var(--txt);letter-spacing:-.01em}
  .hero .htxt .l{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5}
  .hero .htxt .pnl{font-size:11px;font-weight:700;margin-top:5px;color:var(--sub)}
  .hero .htxt .pnl b{color:var(--txt)}
  .hero .htxt .pnl .pos{color:var(--green)} .hero .htxt .pnl .neg{color:var(--red)}
  .hero .htxt .formula{font-size:9px;color:var(--mut);margin-top:5px;line-height:1.45}

  /* 健檢 2×2 卡 */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .card .n{font-size:23px;font-weight:800;letter-spacing:-.02em}
  .card .l{font-size:10px;color:var(--mut);margin-top:4px;line-height:1.45}
  .insight{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.65;margin-bottom:9px;color:var(--sub)}
  .insight b{color:var(--red)}
  .insight.g{border-left-color:var(--green)} .insight.g b{color:var(--green)}

  /* 行情膠囊列 */
  .tick{display:flex;justify-content:space-between;align-items:center;background:var(--tint);border-radius:11px;padding:0 13px;min-height:44px;margin-bottom:7px;font-size:12.5px}
  .tick b{color:var(--navy);font-weight:700}
  .tick .v{font-variant-numeric:tabular-nums;transition:color .3s;font-weight:800}
  .tick .v.up{color:var(--green)}
  .tick .v.down{color:var(--red)}

  /* ── K 線（點行情列展開；資料來自 /market kind=kline） ──
     顏色一律走變數，不寫死 hex：這段是後於視覺改版寫的，rebase 時 git 不會報衝突
     （兩邊改的是不同行），寫死的色碼會安靜地留在舊語言裡。 */
  .mrow{margin-bottom:7px}
  .mrow .tick{margin-bottom:0;width:100%;border:0;text-align:left;font:inherit;font-size:12.5px;
    align-items:center;min-height:44px;cursor:pointer;box-sizing:border-box}
  .mrow .tick .rt{display:flex;align-items:center;gap:8px}
  .mrow .tick .caret{color:var(--mut);font-size:10px;transition:transform .2s;display:inline-block}
  /* 展開時上下要接成一張卡：行情列收下緣圓角，K 線面板收上緣，圓角值與 .tick 同步 */
  .mrow.open .tick{border-radius:11px 11px 0 0}
  .mrow.open .tick .caret{transform:rotate(180deg)}
  .kl{display:none;background:var(--card);border:1px solid var(--line);border-top:0;
    border-radius:0 0 11px 11px;padding:8px 12px 11px}
  .mrow.open .kl{display:block}
  .kl .pd{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 9px}
  .kl .pd button{flex:1 1 auto;min-height:44px;min-width:44px;border:1px solid var(--line);
    background:var(--card);color:var(--sub);border-radius:9px;font-size:12px;font-weight:700;
    cursor:pointer;padding:0 4px;font-family:inherit}
  .kl .pd button[aria-pressed="true"]{background:var(--tint);color:var(--blue);border-color:var(--blue)}
  .kl .sm{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;
    color:var(--sub);margin-bottom:5px;gap:8px}
  .kl .sm .ch{font-weight:800;font-variant-numeric:tabular-nums}
  .kl .sm .ch.up{color:var(--green)} .kl .sm .ch.down{color:var(--red)}
  .kl svg{display:block;width:100%;height:118px}
  .kl .ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);
    font-variant-numeric:tabular-nums;margin-top:4px}
  .kl .na{font-size:12px;color:var(--sub);padding:26px 0;text-align:center}

  /* ── 對話 ── */
  #chatlog{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .msg{max-width:86%;padding:12px 14px;border-radius:15px;font-size:13.5px;line-height:1.7;margin-bottom:10px}
  .msg.user{align-self:flex-end;background:var(--tint);color:var(--txt);border-bottom-right-radius:5px}
  .msg.ai{align-self:flex-start;background:var(--navy);color:#fff;border-bottom-left-radius:5px}
  .msg.ai b{color:var(--gold)}
  .tools{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
  .tool{font-size:10px;background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:4px 10px;font-weight:700}
  .tool .ok{color:var(--green)}

  /* 三方案卡。次要文字用 --sub 不用 --mut：選中時底色換成 --warm（金框），
     --mut 在暖底上只剩 4.52 對比，離 AA 門檻 4.5 只差 0.02，而這些字只有 10px。
     這三屏是分鏡稿鏡 4–7 的主角，餘裕留窄不划算。 */
  .scen{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;cursor:pointer}
  .scen:active{transform:scale(.99)}
  .scen .hint{font-size:10px;color:var(--sub);margin-top:8px;text-align:right}
  .scen.pick{border-color:var(--gold);border-width:1.5px;background:var(--warm)}
  .scen .t{display:flex;align-items:center;font-size:13.5px;font-weight:800;color:var(--txt);margin-bottom:7px}
  .scen .tag{margin-left:auto;font-size:9.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--tint);color:var(--blue)}
  .scen.pick .tag{background:var(--gold);color:#fff}
  .scen .row{display:flex;gap:10px;font-size:10px;color:var(--sub)}
  .scen .row b{display:block;font-size:12.5px;color:var(--txt);margin-top:2px;font-weight:800}
  .scen .row>div{flex:1}
  .scen .note{font-size:10.5px;color:var(--sub);margin-top:8px;line-height:1.55}

  /* 示範帳戶標示：沒有 MAX 金鑰時，帳戶數字來自命題方提供的一年份資料。
     刻意不用錯誤紅——這不是故障；但要夠顯眼，評審一眼看得出不是真帳戶。
     樣式與 chat.html 同一套（兩條渲染路徑要長得一樣）。 */
  .demo-banner{background:var(--warm);border:1.5px solid var(--gold);border-radius:12px;
    padding:10px 12px;margin-bottom:10px;font-size:12px;font-weight:800;color:var(--txt);line-height:1.65}
  .confirm .demo-line{margin-top:9px;font-size:11.5px;font-weight:800;color:var(--txt);line-height:1.6}
  /* 下單確認卡 */
  .confirm{background:var(--warm);border:1.5px solid var(--gold);border-radius:16px;padding:16px;margin-bottom:12px}
  .confirm .h{font-size:14.5px;font-weight:800;color:var(--txt);margin-bottom:11px}
  .confirm table{width:100%;font-size:12.5px;border-collapse:collapse}
  .confirm td{padding:6px 0;color:var(--sub)}
  .confirm td:last-child{text-align:right;color:var(--txt);font-weight:800}
  .confirm .warn{font-size:10.5px;color:var(--red);margin-top:9px;line-height:1.55}
  .btns{display:flex;gap:9px;margin-top:13px}
  .btns button{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
  .btns button:disabled{opacity:.55;cursor:not-allowed}
  .btns .ok{flex:1.4;background:var(--green);color:#fff}
  .btns .no{flex:1;background:var(--tint);color:var(--sub)}
  .done{background:#EBF9F1;border:1px solid var(--green);color:#116b45;border-radius:12px;padding:11px 14px;font-size:12.5px;font-weight:700;margin-bottom:12px}

  /* 決策軌跡面板 */
  .trail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .trail .h{font-size:12.5px;font-weight:800;color:var(--txt);display:flex;margin-bottom:11px}
  .trail .h span{margin-left:auto;font-size:10px;color:var(--green);font-weight:700}
  .step{display:flex;gap:10px;font-size:11px;color:var(--sub);margin-bottom:8px;align-items:baseline}
  .step i{font-style:normal;color:var(--mut);font-size:10px;flex:none;width:40px}
  .step em{font-style:normal;font-family:ui-monospace,Consolas,monospace;background:var(--tint);color:var(--blue);border-radius:6px;padding:2px 7px;font-size:10px}
  .step.hl em{background:#FFEBC2;color:#8a5a00}

  /* 底部輸入列：手機固定、桌機貼齊對話欄 */
  .inputbar{
    position:fixed;bottom:0;left:0;right:0;background:rgba(251,252,254,.96);
    padding:10px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex;gap:9px;border-top:1px solid var(--line);z-index:20
  }
  .inputbar input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-size:13px;font-family:inherit;color:var(--txt)}
  .inputbar input::placeholder{color:var(--mut)}
  /* 44px 是 Apple HIG 的最小觸控目標 */
  .inputbar button{width:44px;height:44px;border-radius:999px;background:var(--blue);color:#fff;border:0;font-size:16px;cursor:pointer;flex:none}
  @media (min-width:900px){
    .inputbar{position:sticky;bottom:0;border:1px solid var(--line);border-radius:16px;margin-top:8px}
  }

  /* 鍵盤焦點可見（a11y）：滑鼠點擊不顯示、鍵盤 tab 才顯示 */
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .badge:focus-visible{outline-offset:3px}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><img src="maimate_bot_small.png" alt="麥麥"></div>
  <div><h1>MaiMate 麥麥</h1><div class="sub">市場一直在變，麥麥一直陪你</div></div>
  <span class="offline" id="offline">離線展示</span>
  <span class="demo-pill" id="demo-pill">🧪 示範帳戶</span>
  <span class="badge" id="mode-badge" role="button" tabindex="0" aria-label="切換 AI 回應模式（Demo）" style="cursor:pointer" title="點擊切換使用者模式（Demo）">成長陪跑</span>
</header>
<main>
  <aside id="side">
    <div class="hello">早安！這是你今天的投資健檢<span id="hello-basis">依據 2025 年交易紀錄整理（示範資料）</span></div>
    <div id="hero" class="hero"></div>
    <div class="cards" id="health"></div>
    <div class="sec">麥麥幫你看到的事</div>
    <div id="insights"></div>
    <div class="sec">即時行情</div>
    <div id="market"></div>
  </aside>
  <section id="chatcol">
    <aside class="navigation-source" id="navigation-source" aria-live="polite" hidden>
      <b id="navigation-source-title"></b>
      <p id="navigation-source-meta"></p>
    </aside>
    <div id="chatlog"></div>
    <form class="inputbar" id="chatform">
      <input id="q" placeholder="問麥麥任何事，例如：我去年虧最多的是哪一筆？" autocomplete="off">
      <button type="submit" aria-label="送出">➤</button>
    </form>
  </section>
</main>
<script>window.API_BASE = "https://10n5xyf7i4.execute-api.us-west-2.amazonaws.com";</script>
<script src="navigation-context.js"></script>
<script src="chat-context.js"></script>
<script src="health-core.js"></script>
<script src="kline-core.js"></script>
<script src="app.js"></script>
</body>
</html>
