<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>麥麥入口示意 — 從 MAX／MaiCoin App 進入 MaiMate</title>
<!--
  host-app.html — 產品化路徑的可點示意（Demo 用）

  回答簡報「產品化路徑」那頁的問題：MaiMate 怎麼進到既有 App 裡？
  答案是「加一個入口就好，主交易系統零改動」。這頁把那句話變成評審能點的東西。

  設計上刻意只有一層：整頁就是宿主 App 的畫面，沒有手機外框、沒有說明區塊。
  唯一的額外元素是最底下那條 18px 的示意標示列（誠實要求，見下）。

  ⚠️ 宿主畫面是**示意 wireframe**，不是 MAX／MaiCoin 官方畫面的複製，也未使用官方 logo 檔。
     底部常駐標示避免被誤認為官方產品截圖。

  數字規則（本專案鐵則：數字必須指得出來源）：
    - 總資產與持倉 → mocks/account.js（data/health_report.json 的同一個帳戶），
      所以「在 MAX 看到的資產」與「麥麥講的帳戶」是同一個
    - 行情 → 真的打 /market 拿即時價；抓不到就顯示「—」並標「未串接」，不編造
-->
<script>window.API_BASE = "https://ywm2d396r8.execute-api.us-east-1.amazonaws.com";</script>
<script src="mocks/account.js"></script>
<style>
  :root{ --gold:#E8A13A; --up:#12B76A; --down:#F04438; --bar:30px; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* SVG 一律先給尺寸：不給的話會撐到父層寬度（資產卡的眼睛圖示會脹成一整塊） */
  svg{width:20px;height:20px;flex:none;display:block}
  html,body{height:100%}
  body{font-family:-apple-system,"SF Pro TC","PingFang TC","Noto Sans TC",system-ui,sans-serif;
    background:#0E1526;overflow:hidden}

  /* 整頁＝宿主 App 畫面。桌機看時收窄置中，但不畫手機外框 */
  .app{position:fixed;inset:0 0 var(--bar);max-width:460px;margin:0 auto;
    display:flex;flex-direction:column;overflow:hidden}

  /* 不畫假的狀態列——這是要放在真手機上展示的，手機自己就有時間與訊號 */
  .hd{flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
  .wm{font-size:20px;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:7px}
  .wm img{height:26px;width:auto;max-width:132px;display:block}
  /* 沒有官方 logo 檔時的替代字標（見 BRAND 說明） */
  .wm .sq{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:900;color:#0E1526}
  .hdi{display:flex;gap:2px}
  .hdi button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    border:0;background:transparent;color:inherit;cursor:pointer}
  .hdi svg{width:21px;height:21px}

  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 16px}

  /* 資產卡 */
  .ast{border-radius:14px;padding:15px 16px 14px;margin-bottom:16px}
  .ast .t{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.7}
  .ast .t svg{width:14px;height:14px;stroke-width:1.6}
  .ast .v{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .ast .m{display:flex;gap:14px;margin-top:9px;font-size:11px;opacity:.62}

  /* 快捷功能：4 欄等距，線性圖示，不用 emoji */
  .qg{display:grid;grid-template-columns:repeat(4,1fr);row-gap:14px;margin-bottom:18px}
  .qi{border:0;background:transparent;font-family:inherit;color:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px 0;min-height:62px;position:relative}
  .qi .ib{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .qi .ib svg{width:21px;height:21px}
  .qi .lb{font-size:11px;letter-spacing:.01em;line-height:1}
  .qi.mm .ib{background:linear-gradient(140deg,#243768,#16224D);color:var(--gold);
    box-shadow:0 0 0 1.5px rgba(232,161,58,.6)}
  .qi .nw{position:absolute;top:-2px;left:calc(50% + 9px);background:var(--down);color:#fff;
    font-size:8px;font-weight:800;padding:1px 4px;border-radius:4px;letter-spacing:.03em;line-height:1.35}

  /* 分段標題與清單 */
  .sh{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 6px}
  .sh b{font-size:14.5px;font-weight:700;letter-spacing:.01em}
  .sh i{font-style:normal;font-size:10.5px;opacity:.5}
  .lst{margin-bottom:16px}
  .li{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid}
  .li:last-child{border-bottom:0}
  .li .l{display:flex;align-items:center;gap:10px;min-width:0}
  .li .cn{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:9.5px;font-weight:800;color:#fff;letter-spacing:-.02em}
  .li .n1{font-size:14px;font-weight:600;letter-spacing:.01em}
  .li .n2{font-size:11px;opacity:.5;margin-top:1px}
  .li .r{text-align:right;flex:none}
  .li .p1{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .li .p2{font-size:11px;margin-top:2px}
  .pill{display:inline-block;min-width:56px;text-align:center;padding:2px 6px;border-radius:5px;
    font-size:11px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}

  /* MaiCoin 的買賣大按鈕 */
  .duo{display:flex;gap:10px;margin-bottom:16px}
  .duo button{flex:1;min-height:50px;border:0;border-radius:13px;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;color:#fff;letter-spacing:.02em}

  /* 底部分頁 */
  .tb{flex:none;display:flex;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid}
  .tb button{flex:1;border:0;background:transparent;font-family:inherit;cursor:pointer;min-height:50px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
  .tb svg{width:21px;height:21px}
  .tb .tl{font-size:10px;letter-spacing:.02em}
  .tb .dot{position:absolute;top:7px;left:calc(50% + 7px);width:6px;height:6px;border-radius:50%;background:var(--down)}

  /* ── 主題 ── */
  .max{background:#0E1526;color:#EEF2F8}
  .max .wm .sq{background:var(--gold)}
  .max .ast{background:linear-gradient(145deg,#1C2745,#151E36);border:1px solid #263252}
  .max .qi .ib{background:#182242;color:#B9C7E6}
  .max .li{border-color:#1C2540}
  .max .tb{background:#0B1120;border-color:#1C2540}
  .max .tb button{color:#66748F}
  .max .tb button[aria-current=page]{color:#EEF2F8}

  .mc{background:#F6F8FC;color:#101828}
  .mc .wm .sq{background:#16224D;color:#fff}
  .mc .ast{background:linear-gradient(145deg,#16224D,#26386B);color:#fff}
  .mc .qi .ib{background:#EAF0F9;color:#2B3B72}
  .mc .li{border-color:#E6EBF3}
  .mc .tb{background:#fff;border-color:#E6EBF3}
  .mc .tb button{color:#98A2B3}
  .mc .tb button[aria-current=page]{color:#16224D}
  .mc .duo .b{background:var(--up)} .mc .duo .s{background:var(--down)}
  .mc .stat{color:#101828}

  /* ── WebView：麥麥跑在宿主 App 裡 ── */
  .wv{position:absolute;inset:0;z-index:30;background:#fff;
    display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;
    transition:transform .3s cubic-bezier(.32,.72,0,1)}
  .wv.on{transform:translateY(0);visibility:visible}
  .wvb{flex:none;display:flex;align-items:center;padding:calc(3px + env(safe-area-inset-top)) 6px 3px;
    background:#0B1120;color:#fff;border-bottom:1px solid #1C2540}
  .wvb.lt{background:#fff;color:#101828;border-color:#E6EBF3}
  .wvb button{min-width:44px;min-height:44px;border:0;background:transparent;color:inherit;
    font-family:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px}
  .wvb .tt{flex:1;text-align:center;font-size:14px;font-weight:600}
  .wv iframe{flex:1;width:100%;border:0;background:#fff}

  /* ── 底部誠實列（唯一非 App 元素）── */
  /* 高度 30px 是刻意的取捨：它不是模擬 App 的一部分（是給講者用的控制列＋誠實標示），
     拉到 44px 會讓誠實標示反客為主吃掉畫面。要穩定切換可直接用 ?host=mc。 */
  .simbar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);z-index:50;
    background:#05080F;color:#5E6B85;font-size:10.5px;display:flex;align-items:center;
    justify-content:center;gap:8px;letter-spacing:.02em}
  .simbar button{border:0;background:transparent;color:#8A97B3;font-family:inherit;font-size:10.5px;
    cursor:pointer;padding:0 11px;height:var(--bar);text-decoration:underline;text-underline-offset:2px}
  .simbar button[aria-pressed=true]{color:var(--gold);text-decoration:none;font-weight:700}

  .toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(6px);z-index:60;
    background:rgba(11,17,32,.94);color:#fff;font-size:12px;padding:9px 15px;border-radius:10px;
    opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:80%;
    text-align:center;line-height:1.5}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="app" id="app"></div>

<div class="wv" id="wv">
  <div class="wvb" id="wvb">
    <button id="back">‹&nbsp;<span id="hostname">MAX</span></button>
    <div class="tt">麥麥 MaiMate</div>
    <button id="more" aria-label="更多">⋯</button>
  </div>
  <iframe id="frame" title="MaiMate" src="about:blank"></iframe>
</div>

<div class="simbar">
  <span>示意 wireframe · 非官方 App 畫面</span>
  <button id="h-max" aria-pressed="true">MAX</button>
  <button id="h-mc" aria-pressed="false">MaiCoin</button>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
// ── 線性圖示（emoji 看起來像玩具，換成 stroke SVG 才像 App）──
const P = {
  chart: "M3 17l5-6 4 3 6-8M17 6h4v4",
  bolt: "M13 2L4 14h6l-1 8 9-12h-6l1-8z",
  bank: "M3 10h18M5 10v8M19 10v8M9 10v8M15 10v8M2 21h20M12 3l9 5H3l9-5z",
  card: "M2 7h20v11H2zM2 11h20",
  gift: "M20 12v9H4v-9M2 8h20v4H2zM12 8v13M12 8a3 3 0 10-3-3 5 5 0 003 3zM12 8a3 3 0 113-3 5 5 0 01-3 3z",
  users: "M16 20v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 10a4 4 0 100-8 4 4 0 000 8M22 20v-2a4 4 0 00-3-3.9",
  doc: "M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6M8 13h8M8 17h5",
  repeat: "M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3",
  wallet: "M20 12V8H6a2 2 0 010-4h12v4M4 6v12a2 2 0 002 2h14v-4M18 12a2 2 0 000 4h4v-4z",
  book: "M4 19.5A2.5 2.5 0 016.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z",
  list: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",
  chat: "M21 11.5a8.4 8.4 0 01-9 8.4 8.5 8.5 0 01-3.8-.9L3 21l1.9-5a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 018.4-9h.5a8.5 8.5 0 018 8v.3z",
  home: "M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z M9 22V12h6v10",
  swap: "M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4",
  bot: "M12 2v3M5 8h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2v-8a2 2 0 012-2zM9 14h.01M15 14h.01M9.5 18h5",
  user: "M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8",
  search: "M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.35-4.35",
  bell: "M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0",
  eye: "M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 100-6 3 3 0 000 6z",
};
const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
  stroke-linecap="round" stroke-linejoin="round"><path d="${P[k]}"/></svg>`;

// ── 帳戶（與麥麥講的是同一個）──
const ACC = window.MM_ACCOUNT || null;
const money = (v) => "NT$" + Math.round(v).toLocaleString("en-US");
const portfolio = ACC && ACC.holdings ? ACC.holdings.portfolioTwd : null;
const snap = ACC && ACC.holdingsSnapshot ? ACC.holdingsSnapshot : null;

const CN = { twd: "台幣", usdt: "泰達幣", eth: "以太幣", doge: "狗狗幣", usdc: "USD Coin", btc: "比特幣", sol: "Solana" };
const CC = { twd: "#12B76A", usdt: "#26A17B", eth: "#627EEA", doge: "#C2A633", usdc: "#2775CA", btc: "#F7931A", sol: "#9945FF" };
const MKT = [["btctwd", "BTC", "比特幣"], ["ethtwd", "ETH", "以太幣"], ["soltwd", "SOL", "Solana"], ["dogetwd", "DOGE", "狗狗幣"]];

// 官方 logo：把檔案放進 frontend/brand/ 就自動生效，不用改程式（見 brand/README.md）。
// 檔案不存在時 <img> 會 onerror，退回字標——所以少了檔案畫面不會破，只是不夠像。
window.mmLogoFallback = function (img, letter, name) {
  const sq = document.createElement("span");
  sq.className = "sq"; sq.textContent = letter;
  img.replaceWith(sq, document.createTextNode(name));
};

const HOSTS = {
  max: { name: "MAX", mark: "M", theme: "max", light: false, logo: "brand/max.svg",
    quick: [["chart", "現貨"], ["bolt", "槓桿"], ["bank", "理財"], ["card", "充值"],
            ["gift", "活動"], ["users", "邀請"], ["doc", "報表"]],
    tabs: [["home", "首頁"], ["chart", "行情"], ["swap", "交易"], ["bot", "麥麥"], ["user", "我的"]] },
  mc: { name: "MaiCoin", mark: "C", theme: "mc", light: true, logo: "brand/maicoin.svg",
    quick: [["repeat", "定期定額"], ["wallet", "錢包"], ["book", "新手教學"], ["card", "銀行帳戶"],
            ["gift", "推薦好友"], ["list", "交易紀錄"], ["chat", "客服"]],
    tabs: [["home", "首頁"], ["swap", "買賣"], ["repeat", "定投"], ["bot", "麥麥"], ["user", "我的"]] },
};
let cur = "max";

function holdings() {
  if (!snap) return `<div class="li"><div class="l"><div class="n1">持倉資料不足</div></div></div>`;
  return snap.holdings.slice(0, 4).map((h) => {
    const s = h.currency.toUpperCase();
    return `<div class="li"><div class="l">
      <div class="cn" style="background:${CC[h.currency] || "#667085"}">${s.slice(0, 4)}</div>
      <div><div class="n1">${s}</div><div class="n2">${CN[h.currency] || s}</div></div></div>
      <div class="r"><div class="p1">${money(h.value_twd)}</div><div class="n2">${h.pct}%</div></div></div>`;
  }).join("");
}

function markets() {
  return MKT.map(([m, s, n]) => `<div class="li" data-ticker="${s}"><div class="l">
      <div class="cn" style="background:${CC[s.toLowerCase()]}">${s.slice(0, 4)}</div>
      <div><div class="n1">${s}/TWD</div><div class="n2">${n}</div></div></div>
    <div class="r"><div class="p1 q" data-m="${m}" style="opacity:.4">—</div>
      <div class="p2 t" style="opacity:.45;font-size:10px">未串接</div></div></div>`).join("");
}

function render(k) {
  cur = k;
  const H = HOSTS[k];
  const app = document.getElementById("app");
  app.className = "app " + H.theme;
  app.dataset.host = k; // 給煙測一個明確的判定依據（.wm 的文字含 logo 字母，比對會脆）

  const quick = H.quick.map(([i, t]) =>
    `<button class="qi" data-noop="${t}"><span class="ib">${svg(i)}</span><span class="lb">${t}</span></button>`).join("");

  const tabs = H.tabs.map(([i, t]) => {
    const mm = t === "麥麥";
    return `<button ${t === "首頁" ? 'aria-current="page"' : ""}
      ${mm ? 'data-mm="home.html?demo=STEADY_PLANNER" class="mmtab"' : `data-noop="${t}"`}>
      ${mm ? '<span class="dot"></span>' : ""}${svg(i)}<span class="tl">${t}</span></button>`;
  }).join("");

  app.innerHTML = `
    <div class="hd">
      <div class="wm" data-name="${H.name}"><img src="${H.logo}" alt="${H.name}"
        onerror="mmLogoFallback(this,'${H.mark}','${H.name}')"></div>
      <div class="hdi"><button data-noop="搜尋">${svg("search")}</button><button data-noop="通知">${svg("bell")}</button></div>
    </div>
    <div class="body">
      <div class="ast">
        <div class="t">總資產估值（TWD）${svg("eye")}</div>
        <div class="v">${portfolio ? money(portfolio) : "資料不足"}</div>
        <div class="m"><span>${snap ? snap.asOf : "—"}</span><span>${snap ? snap.method : "無持倉快照"}</span></div>
      </div>
      ${k === "mc" ? `<div class="duo"><button class="b" data-noop="買入">買入</button><button class="s" data-noop="賣出">賣出</button></div>` : ""}
      <div class="qg">${quick}
        <button class="qi mm" data-mm="welcome.html"><span class="nw">NEW</span>
          <span class="ib">${svg("bot")}</span><span class="lb">麥麥</span></button>
      </div>
      <div class="sh"><b>我的持倉</b><i>來源 health_report.json</i></div>
      <div class="lst">${holdings()}</div>
      <div class="sh"><b>行情</b><i id="mkt-src">讀取中…</i></div>
      <div class="lst">${markets()}</div>
    </div>
    <div class="tb">${tabs}</div>`;

  document.getElementById("hostname").textContent = H.name;
  document.getElementById("wvb").classList.toggle("lt", H.light);
  document.getElementById("h-max").setAttribute("aria-pressed", String(k === "max"));
  document.getElementById("h-mc").setAttribute("aria-pressed", String(k === "mc"));
  loadMarket();
}

// 行情：真的去打 /market。抓不到就維持「—」並標未串接——不編造價格。
async function loadMarket() {
  const src = document.getElementById("mkt-src");
  let ok = 0;
  await Promise.allSettled(MKT.map(async ([m]) => {
    const r = await fetch(`${window.API_BASE}/market?market=${m}&kind=ticker`);
    const j = await r.json();
    const last = j && j.data ? j.data.last : null;
    if (last == null) return;
    const cell = document.querySelector(`.q[data-m="${m}"]`);
    if (!cell) return;
    cell.textContent = Number(last).toLocaleString("en-US");
    cell.style.opacity = "1";
    const tag = cell.parentElement.querySelector(".t");
    tag.textContent = "即時";
    tag.style.opacity = ".55";
    ok++;
  }));
  if (src) src.textContent = ok ? `MAX 即時行情（${ok}/4）` : "未串接，不顯示估計價";
}

// ── WebView ──
const wv = document.getElementById("wv"), frame = document.getElementById("frame");
function open_(page) {
  const ov = new URLSearchParams(location.search).get("entry");
  frame.src = ov && /^[\w.-]+\.html(\?[\w=&.-]*)?$/.test(ov) ? ov : page;
  wv.classList.add("on");
}
function close_() { wv.classList.remove("on"); setTimeout(() => { frame.src = "about:blank"; }, 320); }

let tt;
function toast(m) {
  const el = document.getElementById("toast");
  el.textContent = m; el.classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 1800);
}

document.addEventListener("click", (e) => {
  const mm = e.target.closest("[data-mm]");
  if (mm) return open_(mm.dataset.mm);
  const np = e.target.closest("[data-noop]");
  if (np) return toast(`「${np.dataset.noop}」是宿主 App 既有功能，本示意未實作`);
});
document.getElementById("back").addEventListener("click", close_);
document.getElementById("more").addEventListener("click", () => toast("宿主 App 的選單，本示意未實作"));
document.getElementById("h-max").addEventListener("click", () => render("max"));
document.getElementById("h-mc").addEventListener("click", () => render("mc"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && wv.classList.contains("on")) close_(); });

const want = new URLSearchParams(location.search).get("host");
render(want === "mc" || want === "maicoin" ? "mc" : "max");
</script>
</body>
</html>
