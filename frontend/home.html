<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBFCFE">
<title>MaiMate 投資導航</title>
<style>
  /* Screen 6：MaiMate 投資導航。沿用 Screen 1–5 的色票、字級、圓角與平塗語言。 */
  :root{
    --bg:#FBFCFE;--card:#FFFFFF;--red:#E64A4D;--blue:#1E4DA7;--txt:#0F172A;
    --sub:#46557B;--mut:#6B7280;--line:#E3E9F5;--tint:#EEF3FC;--warm:#FFF6EC;
    --bar:#7592CA;--sheet-mask:rgba(15,23,42,.42);
    /* 健康分與 K 線沿用 index.html 的視覺系統色（docs/mockups/base.css），
       前綴 --mm- 是為了不撞到本頁既有的 --red。同一個綠／紅在兩頁必須一致。 */
    --mm-gold:#E8A13A;--mm-green:#1F9D66;--mm-red:#D64550;--mm-navy:#16224D
  }
  *{box-sizing:border-box;font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;margin:0}
  html,body{max-width:100%;overflow-x:clip}
  html{background:var(--bg)}
  body{min-height:100svh;background:var(--bg);color:var(--txt)}
  button,input{font:inherit}
  button{color:inherit}
  [hidden]{display:none!important}

  .app-shell{width:min(100%,480px);min-height:100svh;margin:0 auto;background:var(--bg)}
  .home-header{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:9px;
    min-height:58px;padding:calc(8px + env(safe-area-inset-top)) 18px 8px;
    background:rgba(251,252,254,.96);border-bottom:1px solid rgba(227,233,245,.86)
  }
  .home-brand{display:flex;align-items:center;gap:9px;min-width:0}
  .home-brand img{width:35px;height:41px;object-fit:contain;object-position:center bottom}
  .brand-copy{min-width:0}
  .brand-copy b{display:block;font-size:15px;line-height:1.25;letter-spacing:.01em}
  .brand-copy span{display:block;margin-top:2px;color:var(--mut);font-size:10.5px;line-height:1.35}
  .header-actions{display:flex;gap:4px;margin-left:auto}
  .icon-button{
    position:relative;display:grid;place-items:center;width:44px;height:44px;border:0;
    border-radius:12px;background:transparent;cursor:pointer
  }
  .icon-button:hover{background:var(--tint)}
  .icon-button svg{width:21px;height:21px;fill:none;stroke:var(--sub);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .notice-dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}

  .home-main{padding:0 18px calc(190px + env(safe-area-inset-bottom))}
  .home-content{padding-top:13px}
  .greeting{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 70px;align-items:end;min-height:99px}
  .greeting-copy{padding:7px 0 14px}
  .greeting h1{font-size:28px;line-height:1.32;letter-spacing:-.015em;text-wrap:balance}
  .greeting p{margin-top:5px;color:var(--sub);font-size:13px;line-height:1.65}
  .greeting .brand-subtitle{margin-top:3px;color:var(--mut);font-size:11px}
  .greeting img{width:70px;height:auto;align-self:end;margin-bottom:-3px}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @media (prefers-reduced-motion:no-preference){.greeting img{animation:breathe 3.6s ease-in-out infinite}}

  .profile-reminder{
    display:flex;align-items:flex-start;gap:10px;margin:2px 0 13px;padding:11px 12px;
    border:1px solid var(--line);border-radius:12px;background:var(--tint)
  }
  .profile-reminder .copy{flex:1;min-width:0}
  .profile-reminder b{font-size:12.5px}
  .profile-reminder p{margin-top:2px;color:var(--sub);font-size:11.5px;line-height:1.55}
  .profile-reminder button{flex:none;min-height:44px;padding:0 8px;border:0;background:none;color:var(--blue);font-size:12px;font-weight:800;cursor:pointer}

  /* ── 三種版面（＝問卷 Q6 的三種溝通風格；呈現密度不同，資料完全相同）──
     貼在頂欄下的窄橫幅。原本是內容流裡三顆帶框 44px 按鈕＋一行提示，約 84px；
     改成無框文字鈕後剩約 50px，而且不再把問候語往下推。 */
  /* 底部留白放在橫幅上而不是提示行上：提示行選過就收起（見 home.js applyStyle），
     留白掛在它身上會一起消失，橫幅會突然變得很擠。 */
  .style-bar{
    position:sticky;top:58px;z-index:19;padding:0 18px 6px;
    background:rgba(251,252,254,.96);border-bottom:1px solid rgba(227,233,245,.86)
  }
  .style-switch{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
  .style-switch::-webkit-scrollbar{display:none}
  .style-switch .sw-label{flex:none;font-size:11px;color:var(--mut);font-weight:800;margin-right:6px}
  /* 視覺 32px、字 11.5px，但下面的 ::after 會把可點範圍撐到 44px（Apple HIG 最小值）。
     橫幅本身沒有其他控件，放大的熱區不會壓到別人。 */
  .style-switch button{
    position:relative;flex:none;height:32px;padding:0 9px;border:0;border-radius:8px;
    background:none;color:var(--mut);font-size:11.5px;font-weight:700;cursor:pointer;
    font-family:inherit;white-space:nowrap
  }
  .style-switch button::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:44px}
  .style-switch button[aria-pressed="true"]{background:var(--tint);color:var(--blue)}
  .style-hint{margin:-1px 0 0;color:var(--mut);font-size:10px;line-height:1.5}

  /* 成長陪跑（concise）：留結論與摘要，收起解釋段落與證據數字 */
  body[data-home-style="concise"] .today-explanation,
  body[data-home-style="concise"] .module-note,
  body[data-home-style="concise"] .learning-reason,
  body[data-home-style="concise"] .evidence-list{display:none}
  body[data-home-style="concise"] .module-stack{gap:10px}
  body[data-home-style="concise"] .module-card{padding:14px 15px}
  body[data-home-style="concise"] .insight-list .insight-card:nth-child(n+2){display:none}

  /* 安心白話（guided）：保留解釋，收起證據數字列，行距放鬆 */
  body[data-home-style="guided"] .evidence-list{display:none}
  body[data-home-style="guided"] .module-copy{font-size:13.5px;line-height:1.85}
  body[data-home-style="guided"] .module-stack{gap:16px}

  /* 專業效率（analytical）：解釋與證據全展開 */
  body[data-home-style="analytical"] .module-copy{font-size:12.5px;line-height:1.7}
  body[data-home-style="analytical"] .evidence-list{display:flex}

  .module-stack{display:flex;flex-direction:column;gap:14px}
  .module-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 15px}

  /* ── 健康分卡（整合自 index.html 的 hero＋2×2）────────────────────────── */
  /* 高度是這張卡的硬約束：它排在最前面，太高會把第二張卡的開頭擠出第一屏，
     使用者就看不出還能往下捲（smoke_home 19–20 有斷言）。下面每個尺寸都是為了
     讓整張卡收在 ~470px 內，別隨手放大。 */
  .health-head{display:flex;align-items:center;gap:13px;margin-top:9px}
  .health-ring{width:66px;height:66px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
  .health-ring-inner{width:50px;height:50px;border-radius:50%;background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .health-ring-inner b{font-size:20px;font-weight:800;color:var(--mm-navy)}
  .health-ring-inner span{font-size:8px;color:var(--mut);margin-top:2px}
  .health-text{min-width:0}
  .health-worst{font-size:11px;color:var(--sub);line-height:1.45}
  .health-pnl{font-size:11px;margin-top:4px;color:var(--sub)}
  .health-pnl b.pos{color:var(--mm-green)} .health-pnl b.neg{color:var(--mm-red)}
  .health-formula{font-size:9px;color:var(--mut);margin-top:4px;line-height:1.4}
  .health-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
  .health-cell{background:var(--tint);border-radius:11px;padding:9px 10px}
  .health-cell b{display:block;font-size:19px;font-weight:800;color:var(--mm-navy)}
  .health-cell span{display:block;font-size:9.5px;color:var(--mut);margin-top:2px;line-height:1.35}
  .health-cell.tone-risk b{color:var(--mm-red)}
  .health-cell.tone-warn b{color:var(--mm-gold)}
  .health-cell.tone-good b{color:var(--mm-green)}
  .health-insight{font-size:11px;line-height:1.55;margin-top:8px;padding:8px 10px;
    border-left:3px solid var(--mm-red);background:var(--tint);border-radius:9px}
  .health-insight.tone-good{border-left-color:var(--mm-green)}
  .health-source{font-size:9px;color:var(--mut);margin-top:8px}

  /* ── 行情卡＋K 線（消費 /market，見 kline-core.js）─────────────────────── */
  .market-note{font-size:10.5px;color:var(--mut);margin-top:4px}
  .market-list{margin-top:9px}
  .market-row+.market-row{margin-top:6px}
  /* 44px 是 Apple HIG 的最小觸控目標，整列可點 */
  .market-tick{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;
    padding:8px 12px;background:var(--tint);border:0;border-radius:11px;text-align:left;cursor:pointer}
  .market-tick b{font-size:12.5px;color:var(--mm-navy)}
  .market-price{margin-left:auto;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;transition:color .3s}
  .market-price.up{color:var(--mm-green)} .market-price.down{color:var(--mm-red)}
  .market-caret{font-size:10px;color:var(--mut);transition:transform .2s}
  .market-tick[aria-expanded="true"] .market-caret{transform:rotate(180deg)}
  .market-panel{padding:9px 2px 2px}
  .market-periods{display:flex;gap:6px;flex-wrap:wrap}
  .market-period{min-width:44px;min-height:44px;padding:0 10px;border:1px solid var(--line);
    background:var(--card);border-radius:10px;font-size:11px;color:var(--sub);cursor:pointer}
  .market-period.active{border-color:var(--mm-gold);color:var(--mm-navy);font-weight:700;background:#FFFDF6}
  .market-chart{margin-top:9px}
  .market-chart svg{width:100%;height:132px;display:block}
  .market-axis{display:flex;justify-content:space-between;gap:8px;
    font-size:9.5px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
  .market-empty{font-size:11px;color:var(--mut);padding:14px 0;text-align:center}
  .market-offline{font-size:11px;color:var(--mut);margin-top:9px;line-height:1.5}
  .module-eyebrow{font-size:12px;font-weight:800;color:var(--blue)}
  .module-title{font-size:17px;line-height:1.45}
  .module-copy{margin-top:7px;color:var(--sub);font-size:13px;line-height:1.72}
  .module-note{margin-top:10px;color:var(--mut);font-size:11.5px;line-height:1.65}
  .module-action{
    display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:13px;
    border:0;background:none;color:var(--blue);font-size:13px;font-weight:800;cursor:pointer
  }
  .module-action::after{content:"›";margin-left:5px;font-size:18px;line-height:1}
  .secondary-action{border:1px solid var(--line);border-radius:12px;padding:0 13px;background:#fff;color:var(--sub)}
  .secondary-action::after{content:""}

  .today-card{
    overflow:hidden;position:relative;padding:18px 16px 16px;background:var(--blue);border-color:var(--blue);color:#fff
  }
  .today-card::after{content:"";position:absolute;right:-34px;top:-46px;width:112px;height:112px;border-radius:16px;background:rgba(255,255,255,.08);transform:rotate(18deg)}
  .today-card .module-eyebrow{position:relative;z-index:1;color:#DCE7FF}
  .today-card h2{position:relative;z-index:1;margin-top:8px;font-size:17px;line-height:1.55;letter-spacing:-.01em;text-wrap:balance}
  .today-card .today-explanation{position:relative;z-index:1;margin-top:9px;color:#EAF0FF;font-size:13px;line-height:1.7}
  .today-meta{position:relative;z-index:1;display:flex;align-items:center;gap:6px;margin-top:10px;color:#DCE7FF;font-size:10.5px}
  .today-meta span{display:inline-flex;align-items:center;gap:5px}
  .today-meta span+span::before{content:"·";margin-right:1px}
  .impact-list{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
  .impact-item{min-width:0;padding:10px 8px;border-radius:12px;background:rgba(255,255,255,.12)}
  .impact-item span{display:block;color:#DCE7FF;font-size:10.5px;white-space:nowrap}
  .impact-item b{display:block;margin-top:3px;font-size:14px}
  .today-actions{position:relative;z-index:1;display:flex;align-items:center;gap:8px;margin-top:13px}
  .today-actions .primary{
    min-height:46px;padding:0 15px;border:0;border-radius:12px;background:#fff;color:var(--blue);font-size:13px;font-weight:800;cursor:pointer
  }
  .today-actions .refresh{
    width:44px;height:44px;border:1px solid rgba(255,255,255,.34);border-radius:12px;background:transparent;color:#fff;cursor:pointer
  }
  .question-row{position:relative;z-index:1;display:flex;gap:7px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .question-row::-webkit-scrollbar{display:none}
  .question-row button{
    flex:none;min-height:44px;max-width:230px;padding:8px 11px;border:1px solid rgba(255,255,255,.28);
    border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font-size:11.5px;text-align:left;cursor:pointer
  }

  .plan-card{padding-top:16px}
  .status-pill{display:inline-flex;align-items:center;min-height:26px;margin-top:9px;padding:3px 9px;border-radius:12px;background:var(--tint);color:var(--blue);font-size:11px;font-weight:800}
  .plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
  .plan-column{min-width:0;padding:12px 10px;border-radius:12px;background:var(--tint)}
  .plan-column.recent{background:#F6F7FA}
  .plan-column h3{font-size:12px;color:var(--blue)}
  .plan-column.recent h3{color:var(--sub)}
  .compact-list{display:flex;flex-direction:column;gap:8px;margin-top:9px;padding:0;list-style:none}
  .compact-list li{position:relative;padding-left:12px;color:var(--sub);font-size:11.5px;line-height:1.55}
  .compact-list li::before{content:"";position:absolute;left:0;top:.58em;width:5px;height:5px;border-radius:50%;background:var(--bar)}

  .attribution-label{display:flex;gap:10px;align-items:baseline;margin-top:8px;color:var(--mut);font-size:11.5px}
  .attribution-bars{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .attribution-row{display:grid;grid-template-columns:minmax(82px,1fr) 42px;gap:4px 10px;align-items:center}
  .attribution-row .label{font-size:12.5px;color:var(--sub)}
  .attribution-row .value{text-align:right;font-size:12.5px;font-weight:800;color:var(--blue)}
  .bar-track{grid-column:1/-1;height:8px;overflow:hidden;border-radius:12px;background:var(--tint)}
  .bar-fill{height:100%;border-radius:12px;background:var(--bar);transition:width .22s ease}

  .moment-layout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
  .moment-column{min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px}
  .moment-column time{display:block;color:var(--blue);font-size:11px;font-weight:800}
  .moment-column b{display:block;margin-top:5px;font-size:12.5px;line-height:1.5}
  .moment-column ul{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding:0;list-style:none}
  .moment-column li{color:var(--sub);font-size:11.5px;line-height:1.55}
  .empty-block{margin-top:12px;padding:14px;border-radius:12px;background:var(--tint)}
  .empty-block b{font-size:13px}
  .empty-block p{margin-top:5px;color:var(--sub);font-size:12px;line-height:1.65}

  .insight-section{padding:0;border:0;background:transparent}
  .insight-section>.module-title{padding:2px 1px 0}
  .insight-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .insight-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}
  .insight-card h3{font-size:15px;line-height:1.5}
  .insight-card .summary{margin-top:6px;color:var(--sub);font-size:12.5px;line-height:1.7}
  .evidence-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .evidence-chip{padding:6px 8px;border-radius:12px;background:var(--tint);color:var(--sub);font-size:10.5px;line-height:1.35}
  .insight-questions{display:flex;flex-direction:column;margin-top:9px}
  .insight-questions button{min-height:44px;border:0;border-top:1px solid var(--line);background:none;color:var(--blue);font-size:12px;font-weight:700;text-align:left;cursor:pointer}
  .module-controls{display:flex;gap:4px;justify-content:flex-end;margin-top:7px}
  .module-controls button{min-height:44px;padding:0 8px;border:0;background:none;color:var(--mut);font-size:11.5px;cursor:pointer}

  .contextual-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .contextual-question{
    display:flex;align-items:center;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);
    border-radius:12px;background:#fff;color:var(--txt);font-size:12.5px;font-weight:700;text-align:left;cursor:pointer
  }
  .contextual-question::after{content:"›";margin-left:auto;padding-left:8px;color:var(--blue);font-size:18px}

  .learning-card{background:var(--warm)}
  .learning-meta{display:flex;gap:7px;margin-top:9px;color:var(--mut);font-size:11px}
  .learning-reason{margin-top:10px;padding:9px 10px;border-radius:12px;background:#fff;color:var(--sub);font-size:11.5px;line-height:1.6}

  .snapshot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
  .snapshot-item{padding:11px;border-radius:12px;background:var(--tint)}
  .snapshot-item span{display:block;color:var(--mut);font-size:10.5px}
  .snapshot-item b{display:block;margin-top:3px;font-size:13px;line-height:1.4}
  .snapshot-footer{display:flex;align-items:center;gap:8px;margin-top:9px;color:var(--mut);font-size:11px}
  .snapshot-footer button{margin-left:auto;min-height:44px;border:0;background:none;color:var(--blue);font-size:11.5px;font-weight:800;cursor:pointer}

  .status-card{display:flex;align-items:flex-start;gap:11px}
  .status-mark{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:12px;background:var(--tint);color:var(--blue);font-size:12px;font-weight:900}
  .status-copy{flex:1;min-width:0}
  .status-copy h2{font-size:15px;line-height:1.45}
  .status-copy p{margin-top:4px;color:var(--sub);font-size:12px;line-height:1.65}

  .skeleton{padding-top:14px}
  .skeleton-line,.skeleton-card{position:relative;overflow:hidden;background:#EEF1F7}
  .skeleton-line{height:13px;border-radius:12px;margin-top:8px}
  .skeleton-line.title{width:72%;height:22px}
  .skeleton-line.short{width:48%}
  .skeleton-card{height:288px;margin-top:20px;border-radius:16px}
  .skeleton-card.small{height:170px;margin-top:14px}
  @keyframes shimmer{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
  @media (prefers-reduced-motion:no-preference){
    .skeleton-line::after,.skeleton-card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.68),transparent);animation:shimmer 1.3s ease-in-out infinite}
  }

  .home-error{padding:64px 4px 20px;text-align:center}
  .home-error img{width:92px;height:auto}
  .home-error h1{margin-top:12px;font-size:28px}
  .home-error p{margin:8px auto 0;max-width:320px;color:var(--sub);font-size:13px;line-height:1.75}
  .error-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .error-actions button{min-height:48px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer}
  .error-actions .primary{border:0;background:var(--blue);color:#fff}
  .error-actions .secondary{border:1px solid var(--line);background:#fff;color:var(--txt)}

  .persistent-chat{
    position:fixed;left:50%;bottom:calc(62px + env(safe-area-inset-bottom));z-index:18;
    width:min(480px,100%);transform:translateX(-50%);padding:8px 14px;
    background:var(--bg)
  }
  .chat-quick{display:flex;gap:7px;overflow-x:auto;padding:0 1px 7px;scrollbar-width:none}
  .chat-quick::-webkit-scrollbar{display:none}
  .chat-quick button{flex:none;min-height:44px;padding:7px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--sub);font-size:11.5px;font-weight:700;cursor:pointer}
  .chat-box{display:flex;align-items:center;gap:7px;padding:7px 7px 7px 13px;border:1px solid #CED9ED;border-radius:16px;background:#fff;box-shadow:0 7px 20px rgba(15,23,42,.1)}
  .chat-box label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .chat-box input{min-width:0;flex:1;height:44px;border:0;outline:0;background:transparent;color:var(--txt);font-size:12.5px}
  .chat-box input::placeholder{color:var(--mut)}
  .chat-box button{display:grid;place-items:center;flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:20px;font-weight:800;cursor:pointer}

  .bottom-nav{
    position:fixed;left:50%;bottom:0;z-index:19;display:grid;grid-template-columns:repeat(4,1fr);
    width:min(480px,100%);min-height:62px;transform:translateX(-50%);
    padding:3px 7px env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line)
  }
  .nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border:0;background:none;color:var(--mut);font-size:10.5px;font-weight:700;cursor:pointer}
  .nav-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav-item[aria-current="page"]{color:var(--blue)}

  .sheet-root{position:fixed;inset:0;z-index:40;visibility:hidden;pointer-events:none;transition:visibility 0s linear .23s}
  .sheet-mask{position:absolute;inset:0;background:var(--sheet-mask);opacity:0;transition:opacity .2s}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;max-height:82svh;overflow:hidden;background:#fff;
    border-radius:16px 16px 0 0;transform:translateY(101%);transition:transform .23s ease
  }
  .sheet-root.open{visibility:visible;pointer-events:auto;transition-delay:0s}
  .sheet-root.open .sheet-mask{opacity:1}
  .sheet-root.open .sheet{transform:translateY(0)}
  .sheet-grab{width:38px;height:4px;margin:9px auto 0;border-radius:12px;background:#D5DEF0}
  .sheet-head{display:flex;align-items:center;gap:8px;padding:10px 18px 12px;border-bottom:1px solid var(--line)}
  .sheet-head h2{font-size:17px}
  .sheet-close{display:grid;place-items:center;width:44px;height:44px;margin-left:auto;border:0;border-radius:12px;background:none;color:var(--mut);font-size:18px;cursor:pointer}
  .sheet-body{overflow-y:auto;padding:5px 18px calc(20px + env(safe-area-inset-bottom))}
  .notification-item{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
  .notification-item:first-child{border-top:0}
  .notification-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:12px;background:var(--tint);color:var(--blue);font-size:11px;font-weight:900}
  .notification-item b{font-size:13px}
  .notification-item p{margin-top:3px;color:var(--sub);font-size:11.5px;line-height:1.6}

  .toast{position:fixed;left:50%;bottom:160px;z-index:50;max-width:calc(100% - 32px);transform:translate(-50%,12px);padding:10px 14px;border-radius:12px;background:var(--txt);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  :focus-visible{outline:2px solid var(--red);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
  @media (max-width:374px){
    .home-main{padding-left:14px;padding-right:14px}
    .home-header{padding-left:14px;padding-right:10px}
    .greeting{grid-template-columns:minmax(0,1fr) 62px}
    .greeting img{width:62px}
    .impact-item{padding-left:6px;padding-right:6px}
    .impact-item span{font-size:10px}
    .today-card h2{font-size:17px}
  }
</style>
</head>
<body>
<div class="app-shell" id="home-root">
  <header class="home-header" id="home-header">
    <div class="home-brand" aria-label="麥麥 MaiMate">
      <img src="maimate_hero.png" alt="">
      <div class="brand-copy"><b>麥麥 MaiMate</b><span>投資導航</span></div>
    </div>
    <div class="header-actions">
      <button class="icon-button" id="home-notifications" type="button" aria-label="查看通知" aria-haspopup="dialog" aria-controls="notification-sheet" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
        <span class="notice-dot" id="notification-dot" aria-hidden="true"></span>
      </button>
      <button class="icon-button" id="home-settings" type="button" aria-label="開啟設定">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
      </button>
    </div>
  </header>

  <!-- 版面切換做成貼在頂欄下的窄橫幅（原本是內容流裡三顆 44px 帶框按鈕＋提示行，
       吃掉約 84px 首屏）。窄化不能犧牲熱區：視覺 32px，靠 ::after 撐出 44px 隱形
       觸控範圍——同 index.html 模式徽章那招。內容還沒好之前整條隱藏，避免使用者
       在骨架畫面上切一個還沒東西可切的版面。 -->
  <div class="style-bar" id="home-style-bar" hidden>
    <div class="style-switch" id="home-style-switch" role="group" aria-label="選擇版面呈現方式"
         aria-describedby="home-style-hint">
      <span class="sw-label">版面</span>
      <!-- 標籤與 app.js 的 MODE_LABELS 同名同序（安心白話／成長陪跑／專業效率）。
           同一個「麥麥怎麼跟你說話」在三個畫面叫三套名字，使用者會以為是三件事。
           smoke:home:integration 第 12 段會逐字比對，改一邊就會紅。 -->
      <button type="button" data-style="guided" aria-pressed="false">安心白話</button>
      <button type="button" data-style="concise" aria-pressed="false">成長陪跑</button>
      <button type="button" data-style="analytical" aria-pressed="false">專業效率</button>
    </div>
    <p class="style-hint" id="home-style-hint" aria-live="polite"></p>
  </div>

  <main class="home-main" id="home-main">
    <section class="skeleton" id="home-loading" aria-label="正在整理首頁" aria-busy="true">
      <div class="skeleton-line title"></div>
      <div class="skeleton-line short"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card small"></div>
    </section>

    <section class="home-error" id="home-error" role="alert" aria-live="assertive" tabindex="-1" hidden>
      <img src="maimate_hero.png" alt="麥麥">
      <h1>這次沒有載入完成</h1>
      <p id="home-error-copy">麥麥還在這裡，你可以重新載入，或先問一般市場與金融問題。</p>
      <div class="error-actions">
        <button class="primary" id="home-retry" type="button">重新載入</button>
        <button class="secondary" id="home-error-chat" type="button">問麥麥</button>
      </div>
    </section>

    <div class="home-content" id="home-content" hidden>
      <section class="greeting" id="personal-greeting">
        <div class="greeting-copy">
          <h1 id="home-greeting-title"></h1>
          <p id="home-greeting-subtitle"></p>
          <p class="brand-subtitle" id="home-brand-subtitle">市場一直在變，麥麥會陪你一起看懂。</p>
        </div>
        <img src="maimate_hero.png" alt="麥麥在這裡陪你">
      </section>
      <aside class="profile-reminder" id="profile-draft-reminder" hidden>
        <div class="copy"><b>你的投資樣貌還沒確認</b><p>目前已先套用初步設定，你可以隨時回去確認。</p></div>
        <button type="button" id="profile-draft-link">去看看</button>
      </aside>
      <div class="module-stack" id="home-modules"></div>
    </div>
  </main>

  <form class="persistent-chat" id="persistent-chat-entry">
    <div class="chat-quick" id="home-chat-quick" hidden>
      <button type="button" data-chat-quick="today">問今天變化</button>
      <button type="button" data-chat-quick="portfolio">問我的持倉</button>
      <button type="button" data-chat-quick="history">問過去相似情況</button>
      <button type="button" data-chat-quick="term">問金融名詞</button>
    </div>
    <div class="chat-box">
      <label for="home-chat-input">想問麥麥什麼？</label>
      <input id="home-chat-input" maxlength="160" autocomplete="off" placeholder="問今天變化、持倉、交易習慣或金融名詞">
      <button type="submit" id="home-chat-submit" aria-label="帶著問題前往問麥麥">›</button>
    </div>
  </form>

  <nav class="bottom-nav" id="home-bottom-nav" aria-label="主要功能">
    <button class="nav-item" type="button" data-home-tab="home" data-home-nav="/maimate/home" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg><span>首頁</span>
    </button>
    <button class="nav-item" type="button" data-home-tab="insights" data-home-nav="/maimate/insights">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/></svg><span>洞察</span>
    </button>
    <button class="nav-item" type="button" data-home-tab="chat" data-home-nav="/maimate/chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/></svg><span>問麥麥</span>
    </button>
    <button class="nav-item" type="button" data-home-tab="settings" data-home-nav="/maimate/settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>我的</span>
    </button>
  </nav>
</div>

<div class="sheet-root" id="notification-sheet" aria-hidden="true">
  <div class="sheet-mask" data-close-notifications></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="notification-title" tabindex="-1">
    <div class="sheet-grab"></div>
    <header class="sheet-head">
      <h2 id="notification-title">通知</h2>
      <button class="sheet-close" type="button" data-close-notifications aria-label="關閉通知">✕</button>
    </header>
    <div class="sheet-body" id="notification-list"></div>
  </section>
</div>

<div class="toast" id="home-toast" role="status" aria-live="polite"></div>

<!-- 這一頁原本沒有 API_BASE，於是 home-service 的 fetch 全部落到同源、失敗、靜默走 mock——
     畫面完整但沒有一筆真資料。補上之後 /health 與 /market 才真的接得到。
     鐵則：每次重部署都要跟著改（DEPLOY.md 清單）。 -->
<script>window.API_BASE = "https://10n5xyf7i4.execute-api.us-west-2.amazonaws.com";</script>
<script src="mocks/account.js"></script>
<script src="mocks/onboarding.js"></script>
<script src="onboarding-core.js"></script>
<script src="investment-analysis.js"></script>
<script src="mocks/home.js"></script>
<!-- 純函式層要在 home-core 之前：home-core 的 marketWatch 驗證會用到 MM_MARKET_CORE -->
<script src="kline-core.js"></script>
<script src="market-core.js"></script>
<script src="health-core.js"></script>
<script src="home-core.js"></script>
<script src="home-service.js"></script>
<script src="navigation-context.js"></script>
<script src="home.js"></script>
</body>
