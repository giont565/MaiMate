<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>問麥麥｜MaiMate</title>
<style>
  /* Screen 7：設計 token 與 Screen 1–6 完全一致（色票／字級 44-28-17-14／圓角 16-12） */
  :root{--bg:#FBFCFE;--card:#FFFFFF;--red:#E64A4D;--blue:#1E4DA7;--txt:#0F172A;--sub:#46557B;--mut:#6B7280;--line:#E3E9F5;--tint:#EEF3FC;--warm:#FFF6EC}
  *{box-sizing:border-box;font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;margin:0}
  html,body{overflow-x:clip}
  body{background:var(--bg);color:var(--txt);padding-bottom:calc(150px + env(safe-area-inset-bottom))}

  /* ── Header（固定）── */
  .chat-header{position:sticky;top:0;z-index:20;background:rgba(251,252,254,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:8px 12px calc(8px);display:flex;align-items:center;gap:8px}
  .chat-header .icon-button{min-width:44px;min-height:44px;border:0;background:none;color:var(--sub);font-size:20px;cursor:pointer;border-radius:12px}
  .chat-header .who{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .chat-header .who img{width:34px;height:auto;flex:none}
  .chat-header .who b{font-size:16px;display:block;line-height:1.25}
  .chat-header .who span{font-size:11.5px;color:var(--mut);display:block;line-height:1.4}
  .more-menu{position:absolute;right:10px;top:56px;background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 12px 30px rgba(22,34,77,.14);padding:6px;z-index:25;min-width:186px}
  .more-menu[hidden]{display:none}
  .more-menu button{display:block;width:100%;text-align:left;min-height:44px;padding:0 12px;border:0;background:none;
    color:var(--txt);font-size:13.5px;font-family:inherit;cursor:pointer;border-radius:12px}
  .more-menu button:hover{background:var(--tint)}

  main{max-width:480px;margin:0 auto;padding:0 16px}

  /* ── Context Banner ── */
  .ctx-banner{margin-top:12px;background:var(--tint);border:1px solid #DCE6F8;border-radius:16px;padding:13px 14px}
  .ctx-banner[hidden]{display:none}
  .ctx-banner .src{font-size:11.5px;font-weight:800;color:var(--blue)}
  .ctx-banner .sum{font-size:14px;font-weight:700;line-height:1.55;margin-top:4px}
  .ctx-banner .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .ctx-banner .tags span{background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 9px;font-size:11px;color:var(--sub)}
  .ctx-banner .acts{display:flex;gap:4px;margin-top:6px}
  .ctx-banner .acts button{min-height:44px;border:0;background:none;color:var(--blue);font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;padding:0 6px}

  /* ── 訊息 ── */
  .msg-list{display:flex;flex-direction:column;gap:14px;padding:14px 0 6px}
  .bubble-user{align-self:flex-end;max-width:86%;background:var(--blue);color:#fff;border-radius:16px 16px 4px 16px;
    padding:11px 14px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .card-ai{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 14px}
  .card-ai .who-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .card-ai .who-row img{width:24px;height:auto}
  .card-ai .who-row b{font-size:12.5px;color:var(--sub)}
  .card-ai .direct{font-size:16px;font-weight:800;line-height:1.6}
  .card-ai .text{margin-top:8px;font-size:13.5px;color:var(--sub);line-height:1.8;white-space:pre-wrap}
  .blk{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
  .blk .bt{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:7px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px}
  .kv span{color:var(--mut)}
  .kv b{font-weight:800;text-align:right}
  .notice-list li{font-size:12px;color:var(--mut);line-height:1.7;list-style:none;padding-left:14px;position:relative}
  .notice-list li::before{content:"・";position:absolute;left:0}
  .glossary{background:var(--warm);border-radius:12px;padding:11px 12px}
  .glossary b{font-size:13.5px}
  .glossary span{display:block;font-size:11.5px;color:var(--mut);margin-top:3px}

  /* 安全邊界卡：冷靜、不責備 */
  .boundary{background:var(--warm);border:1px solid #F2E2CE;border-radius:12px;padding:13px}
  .boundary .bm{font-size:14px;line-height:1.75}

  /* 工具狀態 */
  .tool-activity{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--sub)}
  .tool-activity .chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 10px}
  .tool-done{margin-top:10px}
  .tool-done summary{list-style:none;cursor:pointer;font-size:12px;color:var(--mut);min-height:28px;display:flex;align-items:center}
  .tool-done summary::-webkit-details-marker{display:none}
  .tool-done li{font-size:12px;color:var(--mut);line-height:1.8;list-style:none;padding-left:14px;position:relative}
  .tool-done li::before{content:"・";position:absolute;left:0}

  /* 訊息底部操作 */
  .msg-acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:11px;border-top:1px solid var(--line);padding-top:8px}
  .msg-acts button{min-height:44px;border:0;background:none;color:var(--sub);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:0 8px;border-radius:12px}
  .msg-acts button[aria-pressed="true"]{color:var(--blue);background:var(--tint)}

  /* 本次參考卡 */
  .ref-card{background:var(--tint);border:1px solid #DCE6F8;border-radius:12px;padding:12px}
  .ref-card .bt{margin-bottom:6px}
  .ref-card .notice-list li{color:var(--sub);font-size:12.5px}
  .ref-link{margin-top:8px;border:0;background:none;color:var(--blue);font-size:12.5px;font-weight:800;
    cursor:pointer;font-family:inherit;min-height:44px;padding:0;display:block}

  /* 追問／洞察連結 */
  .fu-label{width:100%;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:1px}
  .followups{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .followups button{min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:0 13px;
    font-size:12.5px;font-weight:700;color:var(--txt);cursor:pointer;font-family:inherit}
  .insight-links{display:flex;flex-direction:column;gap:8px;margin-top:11px}
  .insight-links button{min-height:52px;border:1.5px solid var(--blue);background:var(--tint);border-radius:12px;
    padding:10px 13px;text-align:left;font-size:13.5px;font-weight:800;color:var(--blue);cursor:pointer;font-family:inherit}

  /* ── Golden Path：三方案卡／確認卡／決策軌跡（沿用既有結構與文案）── */
  .scen{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;cursor:pointer}
  /* 卡片是可點的選項——沒有游標與提示行，使用者不知道它能點（2026-08-02 實機回報「卡片不能點」）。 */
  .scen .hint{font-size:10px;color:var(--sub);margin-top:8px;text-align:right}
  .scen:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .scen.pick{border-color:var(--blue);box-shadow:0 0 0 2px rgba(30,77,167,.09)}
  .scen .t{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .scen .t .tag{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--blue);background:var(--tint);border-radius:12px;padding:3px 9px}
  .scen .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px}
  .scen .row>div{font-size:12px;color:var(--mut)}
  .scen .row b{display:block;font-size:14px;color:var(--txt);margin-top:2px}
  .scen .note{margin-top:9px;font-size:12px;color:var(--sub);line-height:1.7;background:var(--warm);border-radius:12px;padding:8px 10px}
  .confirm{background:var(--card);border:1px solid var(--blue);border-radius:16px;padding:15px;margin-top:12px}
  .confirm .h{font-size:14.5px;font-weight:800}
  .confirm table{width:100%;margin-top:10px;border-collapse:collapse}
  .confirm td{padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
  .confirm td:first-child{color:var(--mut);width:38%}
  .confirm td:last-child{font-weight:700;text-align:right}
  .confirm .warn{margin-top:10px;font-size:12px;color:var(--sub);line-height:1.7;background:var(--warm);border-radius:12px;padding:9px 10px}
  .confirm .btns{display:flex;gap:9px;margin-top:12px}
  .confirm .btns button{flex:1;min-height:48px;border-radius:12px;border:0;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit}
  .confirm .btns .ok{background:var(--blue);color:#fff}
  .confirm .btns .no{background:#EEF2FA;color:var(--txt)}
  .done{margin-top:11px;background:#EAF5EF;border:1px solid #CBE5D7;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.7}
  .trail{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .trail .h{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .trail .h span{margin-left:auto;font-size:11px;color:var(--mut);font-weight:400}
  .trail .step{display:flex;gap:8px;font-size:12px;color:var(--sub);padding:6px 0;border-top:1px solid var(--line);line-height:1.6}
  .trail .step:first-of-type{border-top:0}
  .trail .step i{font-style:normal;color:var(--mut);flex:none}
  .trail .step em{font-style:normal;font-weight:800;color:var(--txt)}
  .trail .step.hl em{color:var(--blue)}

  /* ── 空白起手式 ── */
  .empty{padding:26px 0 6px;text-align:center}
  .empty img{width:120px;height:auto}
  .empty h2{font-size:22px;font-weight:800;margin-top:10px}
  .empty p{font-size:13.5px;color:var(--sub);line-height:1.75;margin-top:8px}
  .empty .qs{display:flex;flex-direction:column;gap:8px;margin-top:16px;text-align:left}
  .empty .qs button{min-height:48px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;
    font-size:13.5px;font-weight:700;color:var(--txt);cursor:pointer;font-family:inherit}

  /* ── Composer（固定於 Safe Area 上方）── */
  .composer{position:fixed;left:0;right:0;bottom:0;z-index:18;background:rgba(251,252,254,.97);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom))}
  .composer .inner{max-width:480px;margin:0 auto}
  .ctx-chip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--blue);border-radius:12px;
    padding:5px 10px;font-size:11.5px;font-weight:800;margin-bottom:7px;max-width:100%}
  .ctx-chip[hidden]{display:none}
  .ctx-chip button{border:0;background:none;color:var(--blue);cursor:pointer;font-size:13px;padding:0 2px;min-height:24px}
  .composer form{display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;min-height:48px;max-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;
    font-size:14.5px;font-family:inherit;resize:none;background:#fff;color:var(--txt);line-height:1.5}
  .composer button.send{min-width:48px;min-height:48px;border:0;border-radius:12px;background:var(--blue);color:#fff;
    font-size:19px;cursor:pointer;font-family:inherit}
  .composer button.send:disabled{opacity:.45;cursor:default}
  .composer .stop{width:100%;min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:12px;
    color:var(--sub);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:7px}
  .composer .stop[hidden]{display:none}
  .composer .count{text-align:right;font-size:11px;color:var(--mut);margin-top:4px}

  /* ── Bottom Sheet（依據／回饋／歷史，沿用 Screen 5/6 手法）── */
  .sheet-mask{position:fixed;inset:0;background:rgba(13,21,48,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;z-index:31;max-height:85vh;
    transform:translateY(100%);transition:transform .3s ease;display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .sheet-open .sheet-mask{opacity:1;pointer-events:auto}
  .sheet-open .sheet{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){.sheet,.sheet-mask{transition:none}}
  .sheet .grab{width:40px;height:4px;background:#D5DEF0;border-radius:12px;margin:10px auto 0}
  .sheet .shead{display:flex;align-items:center;padding:10px 18px 12px;border-bottom:1px solid var(--line)}
  .sheet .shead b{font-size:15px}
  .sheet .shead .x{margin-left:auto;background:none;border:0;font-size:18px;color:var(--mut);cursor:pointer;min-width:44px;min-height:44px}
  .sheet .sbody{overflow-y:auto;padding:14px 18px 10px}
  .sheet .sbody p{font-size:13px;color:var(--txt);line-height:1.8;margin-bottom:10px}
  .sheet .sfoot{padding:10px 18px calc(14px + env(safe-area-inset-bottom))}
  .sheet .sfoot button{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--blue);color:#fff;
    font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  .ev-item{border-top:1px solid var(--line);padding:10px 0}
  .ev-item:first-child{border-top:0}
  .ev-item b{font-size:13.5px}
  .ev-item span{display:block;font-size:12px;color:var(--mut);margin-top:3px;line-height:1.6}
  .fb-opts{display:flex;flex-direction:column;gap:8px}
  .fb-opts button{min-height:48px;border:1.5px solid var(--line);background:#fff;border-radius:12px;text-align:left;
    padding:0 13px;font-size:13.5px;color:var(--txt);cursor:pointer;font-family:inherit}
  .fb-opts button[aria-pressed="true"]{border-color:var(--blue);background:var(--tint);color:var(--blue);font-weight:800}
  .conv-item{border-top:1px solid var(--line);padding:11px 0;display:flex;gap:10px;align-items:flex-start}
  .conv-item:first-child{border-top:0}
  .conv-item .ci{flex:1;min-width:0;background:none;border:0;text-align:left;cursor:pointer;font-family:inherit;padding:0;min-height:44px}
  .conv-item .ci b{display:block;font-size:14px;line-height:1.5}
  .conv-item .ci span{display:block;font-size:11.5px;color:var(--mut);margin-top:3px}
  .conv-item .del{border:0;background:none;color:var(--mut);font-size:12.5px;cursor:pointer;font-family:inherit;min-height:44px;min-width:44px}

  /* ── 底部導覽（與 Screen 6 同構，避免死路）── */
  .bottom-nav{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:17;display:none}
  .nav-row{max-width:480px;margin:0 auto;display:flex;background:#fff;border:1px solid var(--line);border-radius:16px;
    box-shadow:0 10px 24px rgba(22,34,77,.10);overflow:hidden}
  .nav-row button{flex:1;min-height:48px;border:0;background:none;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer;font-family:inherit}
  .nav-row button[aria-current="page"]{color:var(--blue);background:var(--tint)}
  body.nav-visible .bottom-nav{display:block}

  .state-note{margin:16px 0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);
    border-radius:12px;padding:14px}
  .state-note[hidden]{display:none}
  .state-note b{font-size:14px}
  .state-note p{font-size:13px;color:var(--sub);line-height:1.75;margin-top:5px}
  .state-note .acts{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap}
  .state-note .acts button{min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:0 13px;
    font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--txt)}

  :focus-visible{outline:2px solid var(--red);outline-offset:2px}
  @media (max-width:374px){.empty h2{font-size:20px}.card-ai .direct{font-size:15px}}
  .chat-offline{margin-left:8px;font-size:10.5px;font-weight:800;color:#D64550;white-space:nowrap}
</style>
</head>
<body>

<header class="chat-header">
  <button class="icon-button" id="chat-back" aria-label="返回">‹</button>
      <!-- 離線標示：取不到後端時這段回覆來自離線劇本，畫面必須看得出來 -->
      <span class="chat-offline" id="chat-offline" hidden>離線展示</span>
  <div class="who">
    <img src="maimate_hero.png" alt="">
    <div><b>問麥麥</b><span id="chat-subtitle">依你的資料與目前市場整理</span></div>
  </div>
  <button class="icon-button" id="chat-history" aria-label="對話紀錄" aria-haspopup="dialog">☰</button>
  <button class="icon-button" id="chat-more" aria-label="更多選項" aria-haspopup="menu" aria-expanded="false">⋯</button>
  <div class="more-menu" id="more-menu" role="menu" hidden>
    <button type="button" role="menuitem" data-more="new">開新對話</button>
    <button type="button" role="menuitem" data-more="evidence">查看本次使用資料</button>
    <button type="button" role="menuitem" data-more="clear">清除目前對話</button>
    <button type="button" role="menuitem" data-more="report">回報回答問題</button>
    <button type="button" role="menuitem" data-more="privacy">資料使用方式</button>
  </div>
</header>

<main>
  <section class="ctx-banner" id="ctx-banner" hidden>
    <div class="src" id="ctx-src"></div>
    <div class="sum" id="ctx-sum"></div>
    <div class="tags" id="ctx-tags"></div>
    <div class="acts">
      <button type="button" id="ctx-open">查看原始洞察</button>
      <button type="button" id="ctx-hide">隱藏</button>
    </div>
  </section>

  <div class="state-note" id="chat-state-note" hidden>
    <b id="state-note-title"></b>
    <p id="state-note-copy"></p>
    <div class="acts" id="state-note-acts"></div>
  </div>

  <section class="empty" id="chat-empty" hidden>
    <img src="maimate_hero.png" alt="">
    <h2 id="empty-title"></h2>
    <p id="empty-subtitle"></p>
    <div class="qs" id="empty-questions"></div>
  </section>

  <div class="msg-list" id="chatlog" aria-live="polite" aria-busy="false"></div>
</main>

<nav class="bottom-nav" aria-label="MaiMate 主要導覽">
  <div class="nav-row">
    <button type="button" data-chat-nav="/maimate/home">首頁</button>
    <button type="button" data-chat-nav="/maimate/insights">洞察</button>
    <button type="button" data-chat-nav="/maimate/chat" aria-current="page">問麥麥</button>
    <button type="button" data-chat-nav="/maimate/settings">我的</button>
  </div>
</nav>

<div class="composer">
  <div class="inner">
    <span class="ctx-chip" id="composer-ctx" hidden>
      <span id="composer-ctx-text"></span>
      <button type="button" id="composer-ctx-remove" aria-label="移除這個脈絡">✕</button>
    </span>
    <form id="chatform">
      <textarea id="q" rows="1" maxlength="1000" placeholder="問市場、持倉、交易習慣或金融名詞" aria-label="輸入你的問題"></textarea>
      <button type="submit" class="send" id="chat-send" aria-label="送出問題">›</button>
    </form>
    <button type="button" class="stop" id="chat-stop" hidden>停止回答</button>
    <div class="count" id="chat-count" aria-hidden="true"></div>
  </div>
</div>

<div id="evidence-root">
  <div class="sheet-mask" data-close-sheet="evidence-root"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="本次回答的依據">
    <div class="grab"></div>
    <div class="shead"><b>本次回答的依據</b><button class="x" data-close-sheet="evidence-root" aria-label="關閉">✕</button></div>
    <div class="sbody" id="evidence-body"></div>
    <div class="sfoot"><button type="button" data-close-sheet="evidence-root">我了解了</button></div>
  </div>
</div>

<div id="feedback-root">
  <div class="sheet-mask" data-close-sheet="feedback-root"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="回報這則回答">
    <div class="grab"></div>
    <div class="shead"><b>哪裡不合適？</b><button class="x" data-close-sheet="feedback-root" aria-label="關閉">✕</button></div>
    <div class="sbody">
      <p>你的回饋只用來改善麥麥的說明方式，不會影響你的投資分析。</p>
